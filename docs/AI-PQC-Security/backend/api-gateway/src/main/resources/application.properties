spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=business-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://business-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/business/**

spring.cloud.gateway.server.webmvc.routes[2].id=security-monitoring-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://security-monitoring-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/events
spring.cloud.gateway.server.webmvc.routes[2].predicates[1]=Method=GET

spring.cloud.gateway.server.webmvc.routes[3].id=operational-alerts
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://security-monitoring-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/events/operations/alerts
spring.cloud.gateway.server.webmvc.routes[3].predicates[1]=Method=GET

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# Per-peer token buckets for this gateway instance. Deployment replicas need
# an edge or shared limiter; forwarding headers are not trusted as identities.
security.rate-limit.api-capacity=${RATE_LIMIT_API_CAPACITY:120}
security.rate-limit.api-period-seconds=${RATE_LIMIT_API_PERIOD_SECONDS:60}
security.rate-limit.auth-capacity=${RATE_LIMIT_AUTH_CAPACITY:10}
security.rate-limit.auth-period-seconds=${RATE_LIMIT_AUTH_PERIOD_SECONDS:60}
security.rate-limit.max-clients=${RATE_LIMIT_MAX_CLIENTS:10000}

# Passive auth-route observation only; never enables model blocking or changes policy.
# Set an explicit, new output filename before enabling. Existing files are not overwritten.
security.shadow.enabled=${GATEWAY_SHADOW_ENABLED:false}
security.shadow.output=${GATEWAY_SHADOW_OUTPUT:}
security.shadow.max-peers=${GATEWAY_SHADOW_MAX_PEERS:1024}
security.shadow.max-events-per-peer=${GATEWAY_SHADOW_MAX_EVENTS_PER_PEER:128}
security.shadow.expose-observation-id=${GATEWAY_SHADOW_EXPOSE_OBSERVATION_ID:false}
security.shadow.feature-version=${GATEWAY_SHADOW_FEATURE_VERSION:v1}
