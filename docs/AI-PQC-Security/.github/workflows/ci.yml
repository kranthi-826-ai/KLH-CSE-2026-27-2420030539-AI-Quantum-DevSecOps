name: CI and Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 21 reactor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify

  monitoring-rules:
    name: Prometheus audit alert rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check both scrape configurations and rule file
        run: docker run --rm --network none --entrypoint /bin/promtool -v "${PWD}:/workspace:ro" -w /workspace prom/prometheus:v3.7.3 check config infrastructure/monitoring/prometheus.yml infrastructure/monitoring/prometheus-local.yml
      - name: Test alert hold, recovery and missing-metric semantics
        run: docker run --rm --network none --entrypoint /bin/promtool -v "${PWD}:/workspace:ro" -w /workspace prom/prometheus:v3.7.3 test rules infrastructure/monitoring/audit-alerts.test.yml

  python:
    name: Python AI service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            platform/ai-security-service/requirements.txt
            platform/ai-security-service/requirements-runtime.txt
      - run: python -m pip install --upgrade pip
      - run: pip install pip-audit -r ml/requirements.txt -r platform/ai-security-service/requirements.txt
      - run: pip-audit
      - run: PYTHONPATH=platform/ai-security-service:. pytest -q platform/ai-security-service/tests ml/tests

  frontend:
    name: React dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/web-dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/web-dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    name: Secret history scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
      - run: kubectl kustomize infrastructure/kubernetes > rendered-kubernetes.yaml
      - run: test "$(grep -c '^kind:' rendered-kubernetes.yaml)" -eq 27

  vulnerabilities:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress dependency:go-offline
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: .git,ml/.venv,frontend/web-dashboard/node_modules,ml/data/raw
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
